<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Vault - Movie Tracker</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Premium Dark Glassmorphism Theme */
        :root {
            --bg-color: #07080b;
            --card-bg: rgba(22, 26, 37, 0.65);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-border-focus: rgba(245, 197, 24, 0.4);
            --accent-color: #f5c518; /* Premium IMDb Gold */
            --accent-gradient: linear-gradient(135deg, #ffd028, #d4a300);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing background blobs for rich modern look */
        .bg-glow-1 {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 197, 24, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Toast Notification Container */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast {
            background: rgba(18, 20, 27, 0.95);
            border-left: 4px solid var(--accent-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 300px;
            max-width: 450px;
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success { border-left-color: var(--success-color); }
        .toast.danger { border-left-color: var(--danger-color); }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            width: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Authentication Overlay Screen */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #07080b;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--card-border);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h2 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-logo h2 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-tab.active {
            color: #000;
            background-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(245, 197, 24, 0.2);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        /* Stats Tracker Box */
        .stats-container {
            background: linear-gradient(135deg, rgba(30, 35, 48, 0.6), rgba(26, 29, 36, 0.6));
            backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid var(--card-border);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .stats-container h2 {
            font-family: var(--font-display);
            font-size: 14px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .counter {
            font-family: var(--font-display);
            font-size: 56px;
            font-weight: 900;
            color: var(--accent-color);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(245, 197, 24, 0.1);
        }

        /* Form Controls */
        .input-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(10, 11, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            background-color: rgba(10, 11, 15, 0.95);
            box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.12);
        }

        /* Button Styling with loading states */
        button {
            width: 100%;
            background: var(--accent-gradient);
            color: #000;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(245, 197, 24, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Button Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        .loading .spinner {
            display: inline-block;
        }

        /* Movie Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .movie-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border-color: var(--card-border-focus);
        }

        .movie-poster-container {
            position: relative;
            width: 100%;
            height: 240px;
            background-color: #12141c;
            overflow: hidden;
        }

        .movie-poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-poster-img {
            transform: scale(1.05);
        }

        .poster-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 14px;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #161a25 0%, #0d0f15 100%);
        }

        .poster-placeholder-icon {
            font-size: 32px;
            margin-bottom: 10px;
            opacity: 0.6;
        }

        .movie-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(22,26,37,0) 0%, rgba(15,17,23,0.8) 100%);
        }

        .movie-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 38px;
        }

        .movie-rating {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Premium Floating Delete Button */
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(6px);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 0;
        }

        .delete-btn:hover {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
            transform: scale(1.1);
        }

        /* Top Bar User Layout Info */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-welcome {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .user-welcome span {
            color: white;
            font-weight: 600;
        }

        .logout-link {
            font-size: 13px;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }

        .logout-link:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Responsive adjust */
        @media (max-width: 550px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .movie-poster-container {
                height: 180px;
            }
            .movie-title {
                font-size: 13px;
                height: 32px;
            }
            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- Subtle Premium Background Glow Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Stunning Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Auth Overlay Portal -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-container">
            <div class="auth-logo">
                <h2>cinematic-<span>vault</span></h2>
            </div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Log In</div>
                <div class="auth-tab" id="tabSignup" onclick="switchAuthMode('signup')">Sign Up</div>
            </div>

            <!-- Login Form -->
            <div class="auth-form active" id="loginForm">
                <form onsubmit="handleAuthSubmit(event, 'login')">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="btnLogin">
                        <div class="spinner"></div>
                        <span>Enter Vault</span>
                    </button>
                </form>
            </div>

            <!-- Signup Form -->
            <div class="auth-form" id="signupForm">
                <form onsubmit="handleAuthSubmit(event, 'signup')">
                    <div class="form-group">
                        <label for="signupUsername">Create Username</label>
                        <input type="text" id="signupUsername" placeholder="e.g. moviebuff22" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Create Secure Password</label>
                        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" autocomplete="new-password" required>
                    </div>
                    <button type="submit" id="btnSignup">
                        <div class="spinner"></div>
                        <span>Initialize Vault</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Application Portal -->
    <div class="container">
        <header>
            <h1>cinematic-<span>vault</span></h1>
            <div class="user-profile">
                <div class="user-welcome">Logged in as <span id="sessionUsername">Guest</span></div>
                <div class="logout-link" onclick="logoutUser()">Log Out</div>
            </div>
        </header>

        <div class="stats-container">
            <h2>Total Movies Logged</h2>
            <div class="counter" id="movie-count">0</div>
        </div>

        <div class="input-section">
            <div class="form-group">
                <label for="title">Movie Title</label>
                <input type="text" id="title" placeholder="e.g., Inception">
            </div>
            <div class="form-group">
                <label for="rating">Your Rating</label>
                <select id="rating">
                    <option value="⭐ 1/5">⭐ 1/5</option>
                    <option value="⭐⭐ 2/5">⭐⭐ 2/5</option>
                    <option value="⭐⭐⭐ 3/5">⭐⭐⭐ 3/5</option>
                    <option value="⭐⭐⭐⭐ 4/5">⭐⭐⭐⭐ 4/5</option>
                    <option value="⭐⭐⭐⭐⭐ 5/5" selected>⭐⭐⭐⭐⭐ 5/5</option>
                </select>
            </div>
            <button onclick="addMovie()" id="btnAddMovie">
                <div class="spinner"></div>
                <span>Mark as Watched</span>
            </button>
        </div>

        <h2 style="margin-bottom: 20px; font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text-sub);">Your Cinematic Vault</h2>
        <div class="movie-grid" id="movie-grid"></div>
    </div>

    <script>
        // TMDb API Setup (Fallback search utility)
        const TMDB_API_KEY = "15d2ea6d0dc1d476efbca3eba2b9a775"; 
        
        // Client-side Application State
        let currentToken = localStorage.getItem('vault_token') || null;
        let currentUser = JSON.parse(localStorage.getItem('vault_user')) || null;
        let myMovies = [];

        // Application Startup Configuration
        checkUserSession();

        // Elegant Toast notification system
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '💡';
            if (type === 'success') icon = '✅';
            if (type === 'danger') icon = '⚠️';

            toast.innerHTML = `
                <div class="toast-content">
                    <span>${icon}</span>
                    <span>${message}</span>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);

            // Trigger animation frame to guarantee transition
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            // Auto dismiss toast
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 350);
            }, 4000);
        }

        // Authentication Tab Switcher controller
        function switchAuthMode(mode) {
            if (mode === 'login') {
                document.getElementById('tabLogin').className = 'auth-tab active';
                document.getElementById('tabSignup').className = 'auth-tab';
                document.getElementById('loginForm').className = 'auth-form active';
                document.getElementById('signupForm').className = 'auth-form';
            } else {
                document.getElementById('tabLogin').className = 'auth-tab';
                document.getElementById('tabSignup').className = 'auth-tab active';
                document.getElementById('loginForm').className = 'auth-form';
                document.getElementById('signupForm').className = 'auth-form active';
            }
        }

        // Integrated Authentication API Handler
        async function handleAuthSubmit(event, type) {
            event.preventDefault();
            
            const btn = type === 'login' ? document.getElementById('btnLogin') : document.getElementById('btnSignup');
            const usernameInput = type === 'login' ? document.getElementById('loginUsername') : document.getElementById('signupUsername');
            const passwordInput = type === 'login' ? document.getElementById('loginPassword') : document.getElementById('signupPassword');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showToast("Please supply all credentials!", "danger");
                return;
            }

            if (type === 'signup' && username.length < 3) {
                showToast("Username must be at least 3 characters long", "danger");
                return;
            }
            if (type === 'signup' && password.length < 6) {
                showToast("Password must be at least 6 characters long", "danger");
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch(`/api/auth/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication challenge failed');
                }

                // Successful login or signup
                currentToken = data.token;
                currentUser = data.user;
                
                localStorage.setItem('vault_token', currentToken);
                localStorage.setItem('vault_user', JSON.stringify(currentUser));
                
                showToast(type === 'login' ? `Welcome back, ${currentUser.username}!` : `Account created! Vault initialized.`, "success");
                
                // Reset Forms
                usernameInput.value = "";
                passwordInput.value = "";
                
                checkUserSession();
            } catch (err) {
                showToast(err.message, "danger");
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Validate user session and pull remote assets
        async function checkUserSession() {
            if (currentToken && currentUser) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('sessionUsername').innerText = currentUser.username;
                await fetchMoviesFromServer();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        }

        // End user session
        function logoutUser() {
            localStorage.removeItem('vault_token');
            localStorage.removeItem('vault_user');
            currentToken = null;
            currentUser = null;
            myMovies = [];
            showToast("Successfully logged out.", "success");
            checkUserSession();
        }

        // Fetch User Movie Log Vault from node server
        async function fetchMoviesFromServer() {
            try {
                const response = await fetch('/api/movies', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (response.status === 401 || response.status === 403) {
                    // Force logout on invalid tokens
                    logoutUser();
                    return;
                }
                if (!response.ok) throw new Error("Could not retrieve vault records.");
                
                myMovies = await response.json();
                updateUI();
            } catch (err) {
                showToast(err.message, "danger");
            }
        }

        // Add movie record to server via core lookup pipeline
        async function addMovie() {
            const titleInput = document.getElementById('title');
            const ratingInput = document.getElementById('rating');
            const targetTitle = titleInput.value.trim();
            const btn = document.getElementById('btnAddMovie');

            if (targetTitle === "") {
                showToast("Please type in a movie title!", "danger");
                return;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            let posterUrl = "";
            let verifiedTitle = targetTitle;

            // Fetch live metadata matching verified TMDB database records
            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(targetTitle)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        const bestMatch = data.results[0];
                        verifiedTitle = bestMatch.title; 
                        if (bestMatch.poster_path) {
                            posterUrl = `https://image.tmdb.org/t/p/w500${bestMatch.poster_path}`;
                        }
                    }
                }
            } catch (err) {
                console.warn("TMDb services offline, using structural defaults...", err);
            }

            try {
                // Post data clean and safe to server endpoint
                const response = await fetch('/api/movies', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        title: verifiedTitle,
                        rating: ratingInput.value,
                        poster: posterUrl
                    })
                });

                if (!response.ok) throw new Error("Failed to register movie on the server.");

                const savedMovie = await response.json();
                myMovies.push(savedMovie);
                
                titleInput.value = "";
                showToast(`"${verifiedTitle}" added to vault.`, "success");
                updateUI();
            } catch (err) {
                showToast(err.message, "danger");
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Delete movie entry securely on server
        async function deleteMovie(id, title) {
            try {
                const response = await fetch(`/api/movies/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                if (!response.ok) throw new Error("Could not drop record from server.");

                myMovies = myMovies.filter(movie => movie.id !== id);
                showToast(`"${title}" removed.`, "success");
                updateUI();
            } catch (err) {
                showToast(err.message, "danger");
            }
        }

        // Re-render UI components on local stack modifications
        function updateUI() {
            const grid = document.getElementById('movie-grid');
            const counter = document.getElementById('movie-count');
            
            grid.innerHTML = "";
            counter.innerText = myMovies.length;

            if (myMovies.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <h3>Your Cinematic Vault is empty</h3>
                        <p>Search and mark a movie as watched above to start recording your personal movie-going logs!</p>
                    </div>
                `;
                return;
            }

            myMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                
                // Smart UI Renderer: checks remote image verification state
                const mediaComponent = movie.poster 
                    ? `<img class="movie-poster-img" src="${movie.poster}" alt="${movie.title}" loading="lazy">`
                    : `<div class="poster-placeholder">
                        <div class="poster-placeholder-icon">🎞️</div>
                        <span>${movie.title}</span>
                       </div>`;

                // Safe String injection
                const escapedTitle = movie.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteMovie('${movie.id}', '${escapedTitle}')" title="Delete movie">✕</button>
                    <div class="movie-poster-container">
                        ${mediaComponent}
                    </div>
                    <div class="movie-info">
                        <div class="movie-title" title="${escapedTitle}">${movie.title}</div>
                        <div class="movie-rating">${movie.rating}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
